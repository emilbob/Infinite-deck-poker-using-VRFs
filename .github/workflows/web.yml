name: web

# Builds the wasm engine + Vite app on every PR. This is CI, not deployment:
# hosting moved to Render (see render.yaml), which builds from main after a
# merge. That makes this the only check standing between a broken frontend and
# main — by the time Render builds, a bad commit has already landed.
#
# keep-green only finds a package.json at the repo root, and there isn't one,
# so without this workflow the frontend is invisible to CI entirely — including
# to keep-green's monthly rot check, hence the schedule below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monthly, half an hour after keep-green's Rust check on the same day, so both
  # health checks land together but a failure says which half rotted. Without
  # this, nothing exercises the wasm/web build between merges: Render only
  # builds on push, so a toolchain or dependency drift would sit undetected
  # until the next merge tried to ship.
  schedule:
    - cron: "30 6 15 * *"

permissions:
  contents: read

concurrency:
  # Keyed by event too: otherwise a scheduled run and a push run share a group
  # and cancel-in-progress lets one kill the other.
  group: web-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Poker_VRF/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Poker_VRF/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Must precede `npm ci`: web/package.json depends on ../Poker_VRF/pkg via
      # a file: reference, which npm cannot resolve until wasm-pack creates it.
      - name: Build wasm
        working-directory: Poker_VRF
        run: wasm-pack build --target web --out-dir pkg --release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc -b

      - name: Build site
        working-directory: web
        # `npm run build` would rebuild the wasm; it is already built above.
        # No VITE_BASE: Render serves from a domain root, so vite.config.ts's
        # '/' fallback is correct. It was only set for Pages, which served the
        # site from /<repo>/.
        run: npx vite build

      - name: Check the wasm actually shipped
        working-directory: web
        # A silently missing .wasm would still produce a green build and a
        # page that never deals — the exact failure this repo already hit once.
        # Kept deliberately: Render runs the same guard, but only after a merge.
        run: |
          test -n "$(find dist/assets -name '*.wasm' -size +100k)" \
            || { echo "::error::no .wasm in dist/assets"; exit 1; }
